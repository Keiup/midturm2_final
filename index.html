<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>3D Graphics Pipeline</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #1e1e1e; overflow: hidden; font-family: sans-serif; }
    canvas { display: block; }

    #ui {
      position: fixed;
      top: 12px;
      left: 12px;
      background: rgba(0,0,0,0.65);
      color: #eee;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 13px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-width: 200px;
      user-select: none;
    }
    #ui h3 { font-size: 14px; font-weight: 600; color: #fff; margin-bottom: 2px; }
    #ui label { color: #bbb; font-size: 12px; }
    #ui select, #ui button {
      width: 100%;
      padding: 5px 8px;
      border-radius: 4px;
      border: 1px solid #555;
      background: #2a2a2a;
      color: #eee;
      font-size: 12px;
      cursor: pointer;
    }
    #ui button { background: #3a3a3a; }
    #ui button:hover { background: #4a4a4a; }
    .row { display: flex; flex-direction: column; gap: 3px; }
    .hint { color: #777; font-size: 11px; margin-top: 2px; }
    #fps { color: #7cf; font-weight: bold; }
  </style>
  <script type="module" crossorigin src="/&lt;midturm2_final&gt;/assets/main-BwGhiaKG.js"></script>
</head>
<body>
  <canvas id="canvas"></canvas>

  <div id="ui">
    <h3>3D Pipeline Viewer</h3>

    <div class="row">
      <label>Model</label>
      <select id="modelSelect">
        <option value="teapot">Teapot</option>
        <option value="KAUST_Beacon">beacon</option>
      </select>
    </div>

    <div class="row">
      <label>Shading (1~4)</label>
      <select id="shadingSelect">
        <option value="phong">Phong</option>
        <option value="gouraud">Gouraud</option>
        <option value="wireframe">Wireframe</option>
        <option value="normal">Normal Visualize</option>
      </select>
    </div>

    <button id="normalBtn">Show Normal Buffer</button>

    <div class="hint">
      Drag: Arcball rotation<br>
      Wheel: Zoom (FOV)<br>
      WASD/QE: Camera move<br>
      Arrow keys: Camera rotate<br>
      [N]: Toggle normal buffer
    </div>

    <div>FPS: <span id="fps">--</span></div>
  </div>

</body>
</html>
